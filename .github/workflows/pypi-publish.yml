name: Publish Python Package to PyPI 📦🚀

on:
  release:
    types: [published]
  workflow_dispatch: # Enables manual 'Run workflow' button in Actions tab 🔘⚡

jobs:
  build-and-publish:
    name: Build and publish distribution 🐍📦
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rps-game-python-engine
    permissions:
      id-token: write # Mandatory for secure PyPI Trusted Publishing 🔒

    steps:
      - name: Checkout Source Code 🛎️
        uses: actions/checkout@v4

      - name: Set up Python 3.11 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools 🛠️
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Source & Wheel Archives 📦
        run: python -m build

      - name: Publish Package to PyPI 🚀✨
        uses: pypa/gh-action-pypi-publish@release/v1
